{% extends "layouts/base.html" %}
{% block content %}
<div class="mx-auto flex min-h-[calc(100vh-4rem)] max-w-md items-center">
    <div class="w-full rounded-2xl border border-slate-200 bg-white p-6 shadow-soft dark:border-slate-800 dark:bg-slate-900 sm:p-8">
        <div class="mb-8 text-center">
            <img class="mx-auto h-28 w-auto" src="{{ url_for('static', filename='img/lifeline-sentinel-login-logo.png') }}" alt="Lifeline Sentinel logo">
            <p class="mt-5 text-sm font-semibold uppercase tracking-wide text-sentinel-700 dark:text-sentinel-100">Lifeline Sentinel</p>
            <h1 class="mt-2 text-2xl font-bold text-slate-950 dark:text-white">Create new password</h1>
        </div>
        <form method="post" action="{{ url_for('auth.reset_password', token=token) }}" class="mt-6 space-y-5">
            <div>
                <label class="text-sm font-medium text-slate-700 dark:text-slate-200" for="password">New password</label>
                <input class="mt-2 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-sentinel-600 focus:ring-4 focus:ring-sentinel-100 dark:border-slate-700 dark:bg-slate-950" id="password" name="password" type="password" minlength="8" required autofocus>
            </div>
            <div>
                <label class="text-sm font-medium text-slate-700 dark:text-slate-200" for="confirm_password">Confirm password</label>
                <input class="mt-2 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-sentinel-600 focus:ring-4 focus:ring-sentinel-100 dark:border-slate-700 dark:bg-slate-950" id="confirm_password" name="confirm_password" type="password" minlength="8" required>
            </div>
            <button class="w-full rounded-2xl bg-sentinel-600 px-4 py-3 text-sm font-semibold text-white shadow-soft transition hover:bg-sentinel-700" type="submit">Update password</button>
        </form>
    </div>
</div>
{% endblock %}
